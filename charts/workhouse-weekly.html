const COL = {Ireland:"var(--s1)", Ulster:"var(--s1)", Munster:"var(--s2)", Leinster:"var(--s3)", Connaught:"var(--s4)"};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dlab = s => {const [y,m,d]=s.split("-"); return `${+d} ${MON[m-1]} ${y}`;};
const SRC = {"Series 4":"Relief of Distress papers, fourth series", "13th AR":"13th Annual Report", "1st AR":"Irish 1st Annual Report", "2nd AR":"Irish 2nd Annual Report", "3rd AR":"Irish 3rd Annual Report"};
const CAP = {
  ire: "Ireland. Upper panel: people in the workhouses at the close of each week. Lower panel: deaths in the workhouses during the week. Gaps are weeks with no printed figure. The dashed line marks the change of source on 17 April 1847.",
  prov: "The four provinces. Munster held the most inmates from 1848. Deaths in Munster for January to March 1846 rest on one student copy and are left out."
};
const W=880,H=560,M={l:64,r:84},P1={t:34,b:290},P2={t:352,b:510};
const NS="http://www.w3.org/2000/svg", F="IBM Plex Sans Condensed, Arial Narrow, sans-serif";
const plot=document.getElementById("plot"), tip=document.getElementById("tip");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(k*p>=v)return k*p;}
const fmt=v=>v==null?"..":Math.round(v).toLocaleString("en-IE");
const x=i=>M.l+i/(N-1)*(W-M.l-M.r);
let svg, mode="ire";
function draw(g){
  mode=g; if(svg) svg.remove();
  const geos = g==="ire"?["Ireland"]:PROV;
  svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Workhouse inmates and deaths, week by week, January 1845 to January 1850"});
  plot.insertBefore(svg,tip);
  const panels=[{key:"inmates",P:P1,title:"Inmates at the close of the week"},{key:"deaths",P:P2,title:"Deaths in the week"}];
  // year lines
  for(let yr=1845;yr<=1850;yr++){const i=WK.findIndex(w=>w.startsWith(String(yr)));if(i<0)continue;
    el("line",{x1:x(i),x2:x(i),y1:P1.t,y2:P2.b,stroke:"var(--grid)","stroke-width":1},svg);
    el("text",{x:x(i)+4,y:P2.b+18,"font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=yr;}
  // deaths not printed (Ireland)
  const dI=DATA.series.deaths.Ireland; let i0=null;
  for(let i=0;i<=N;i++){const miss=i<N&&dI[i]==null;
    if(miss&&i0==null)i0=i;
    if(!miss&&i0!=null){const a=x(Math.max(0,i0-.5)),b=x(Math.min(N-1,i-.5));
      el("rect",{x:a,y:P2.t,width:b-a,height:P2.b-P2.t,fill:"var(--gap)","fill-opacity":".07"},svg);
      el("text",{x:(a+b)/2,y:P2.t+16,"text-anchor":"middle","font-family":F,"font-size":11,fill:"var(--muted)"},svg).textContent="not printed";
      i0=null;}}
  const sc={};
  for(const p of panels){
    const vals=geos.flatMap(gg=>DATA.series[p.key][gg].filter(v=>v!=null)), top=Math.max(...vals)*1.05;
    const st=niceStep(top/4), nt=Math.ceil(top/st), ymax=nt*st;
    const y=v=>p.P.b-(v/ymax)*(p.P.b-p.P.t); sc[p.key]=y;
    for(let k=0;k<=nt;k++){const v=st*k,yy=y(v);
      el("line",{x1:M.l,x2:W-M.r,y1:yy,y2:yy,stroke:k?"var(--grid)":"var(--rule)","stroke-width":1},svg);
      el("text",{x:M.l-8,y:yy+4,"text-anchor":"end","font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=fmt(v);}
    el("text",{x:M.l,y:p.P.t-12,"font-family":F,"font-size":13,"font-weight":500,fill:"var(--fg)"},svg).textContent=p.title;
    const ends=[];
    for(const gg of geos){
      const arr=DATA.series[p.key][gg]; let d="",pen=false,last=null;
      arr.forEach((v,i)=>{if(v==null){pen=false;return;} d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true;last=i;});
      el("path",{d,fill:"none",stroke:COL[gg],"stroke-width":g==="ire"?2:1.6,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
      if(last!=null) ends.push({gg,yy:y(arr[last]),xx:x(last)});
    }
    if(g==="prov"){ends.sort((a,b)=>a.yy-b.yy);
      for(let k=1;k<ends.length;k++) if(ends[k].yy-ends[k-1].yy<14) ends[k].yy=ends[k-1].yy+14;
      const lim=p.P.b-6; if(ends.length&&ends[ends.length-1].yy>lim){ends[ends.length-1].yy=lim;
        for(let k=ends.length-2;k>=0;k--) if(ends[k+1].yy-ends[k].yy<14) ends[k].yy=ends[k+1].yy-14;}
      for(const e of ends) el("text",{x:e.xx+8,y:e.yy+4,"font-family":F,"font-size":12,fill:"var(--fg)"},svg).textContent=e.gg;}
  }
  // change of source
  const ic=WK.indexOf("1847-04-17");
  el("line",{x1:x(ic),x2:x(ic),y1:P1.t,y2:P2.b,stroke:"var(--seam)","stroke-width":1.2,"stroke-dasharray":"2 3"},svg);
  el("text",{x:x(ic)-5,y:P1.t+12,"text-anchor":"end","font-family":F,"font-size":11.5,fill:"var(--fg)"},svg).textContent="Irish Annual Reports from 17 Apr 1847";
  // crosshair and hover, linked across both panels
  const hair=el("line",{y1:P1.t,y2:P2.b,stroke:"var(--muted)","stroke-width":1,visibility:"hidden"},svg);
  const dots=[];
  for(const p of panels) for(const gg of geos) dots.push({p,gg,c:el("circle",{r:3.5,fill:COL[gg],stroke:"var(--surface)","stroke-width":1.5,visibility:"hidden"},svg)});
  const hit=el("rect",{x:M.l,y:P1.t,width:W-M.l-M.r,height:P2.b-P1.t,fill:"transparent",tabindex:0,"aria-label":"Move across the chart to read each week; arrow keys step a week"},svg);
  function show(i){
    i=Math.max(0,Math.min(N-1,i)); const px=x(i);
    hair.setAttribute("x1",px);hair.setAttribute("x2",px);hair.setAttribute("visibility","visible");
    for(const o of dots){const v=DATA.series[o.p.key][o.gg][i];
      if(v==null){o.c.setAttribute("visibility","hidden");continue;}
      o.c.setAttribute("cx",px);o.c.setAttribute("cy",sc[o.p.key](v));o.c.setAttribute("visibility","visible");}
    tip.replaceChildren();
    const h=document.createElement("div");h.className="yr";h.textContent="Week ended "+dlab(WK[i]);tip.appendChild(h);
    const row=(label,val,color)=>{const r=document.createElement("div");r.className="row";const sp=document.createElement("span");
      if(color){const k=document.createElement("i");k.className="key";k.style.borderColor=color;sp.appendChild(k);}
      sp.appendChild(document.createTextNode(label));const b=document.createElement("b");b.textContent=val;r.append(sp,b);tip.appendChild(r);};
    if(mode==="ire"){
      row("Inmates",fmt(DATA.series.inmates.Ireland[i]),null);
      const dv=DATA.series.deaths.Ireland[i]; row("Deaths",dv==null?"not printed":fmt(dv),null);
    } else {
      const hd=document.createElement("div");hd.className="hd";hd.textContent="inmates · deaths";tip.appendChild(hd);
      for(const gg of PROV){const dv=DATA.series.deaths[gg][i];row(gg,fmt(DATA.series.inmates[gg][i])+" · "+(dv==null?"..":fmt(dv)),COL[gg]);}
    }
    const [sa,sb]=DATA.src[i], notes=[];
    notes.push(sa===sb||!sb?`Source: ${SRC[sa]}`:`Inmates: ${SRC[sa]}; deaths: ${SRC[sb]}`);
    if(WK[i]>="1846-04-04"&&WK[i]<="1846-11-21"&&sa==="Series 4") notes.push("This printing leaves out a few unions; the fuller count runs about 2% higher");
    for(const f of (DATA.flags[WK[i]]||[])) if((mode==="ire")===f.startsWith("Ireland")) notes.push(f);
    const n=document.createElement("div");n.className="note";n.textContent=notes.join(". ");tip.appendChild(n);
    tip.hidden=false;
    const box=svg.getBoundingClientRect(), left=px*box.width/W+plot.scrollLeft, tw=tip.offsetWidth||200;
    tip.style.top="40px"; tip.style.left=(left+tw+16>box.width?left-tw-12:left+12)+"px";
  }
  const hide=()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");dots.forEach(o=>o.c.setAttribute("visibility","hidden"));};
  hit.addEventListener("pointermove",e=>{const b=svg.getBoundingClientRect();const vx=(e.clientX-b.left)*W/b.width;show(Math.round((vx-M.l)/(W-M.l-M.r)*(N-1)));});
  hit.addEventListener("pointerleave",hide);
  let k=WK.indexOf("1847-03-13"); hit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){k=Math.max(0,Math.min(N-1,k+(e.key==="ArrowRight"?1:-1)));show(k);e.preventDefault();}});
  hit.addEventListener("focus",()=>show(k)); hit.addEventListener("blur",hide);
  // legend, caption, table
  const lg=document.getElementById("legend"); lg.replaceChildren();
  for(const gg of geos){const sp=document.createElement("span");const kk=document.createElement("i");kk.className="key";kk.style.borderColor=COL[gg];sp.append(kk,document.createTextNode(gg));lg.appendChild(sp);}
  document.getElementById("caption").textContent=CAP[g];
  const tb=document.getElementById("table"); tb.replaceChildren();
  const hr=tb.insertRow(), heads=["Week ended",...geos.flatMap(gg=>g==="ire"?["Inmates","Deaths"]:[gg+" inmates",gg+" deaths"])];
  for(const t of heads){const th=document.createElement("th");th.textContent=t;hr.appendChild(th);}
  WK.forEach((w,i)=>{const r=tb.insertRow();r.insertCell().textContent=dlab(w);
    for(const gg of geos){r.insertCell().textContent=fmt(DATA.series.inmates[gg][i]);r.insertCell().textContent=fmt(DATA.series.deaths[gg][i]);}});
}
document.querySelectorAll('section[aria-label="Chart"] .seg button').forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll('section[aria-label="Chart"] .seg button').forEach(o=>o.setAttribute("aria-pressed",String(o===b)));draw(b.dataset.g);}));
draw("ire");
</script>
<script>if(window.top===window.self)document.getElementById("cephCite").hidden=false;</script>
<script>(function(){function h(){var w=document.querySelector('.wrap');parent.postMessage({cephEmbed:'workhouse-weekly',height:Math.ceil((w?w.getBoundingClientRect().bottom+window.scrollY:document.body.scrollHeight)+8)},'*');}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body);document.addEventListener('toggle',h,true);})();</script>
</body></html>
