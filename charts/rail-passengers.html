  let k=S.findIndex(s=>s[1]==="calendar year 1913");hit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){k=Math.max(0,Math.min(S.length-1,k+(e.key==="ArrowRight"?1:-1)));show(k);e.preventDefault();}});
  hit.addEventListener("focus",()=>show(k));hit.addEventListener("blur",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  legend(CLS.map(c=>({label:c.label,color:c.color,cls:"blk"})));
  table(["Period","Railways",...CLS.map(c=>c.label)],S.map(s=>[s[1],(s[6]==="june"||s[6]==="dec")?"Ireland":"26 counties",...CLS.map(c=>(c.k===5&&(s[6]==="june"||s[6]==="dec"))?"..":s[c.k].toFixed(1))]));
}
function draw(m){if(svg)svg.remove();tip.hidden=true;(m==="n"?drawN:drawS)();document.getElementById("caption").textContent=CAP[m];}

  document.querySelectorAll('section[aria-label="Chart"] .seg button').forEach(o=>o.setAttribute("aria-pressed",String(o===b)));draw(b.dataset.m);}));
draw("n");
