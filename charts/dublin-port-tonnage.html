};
const W=880,H=380,M={l:74,r:110,t:18,b:34},X0=1780,X1=1900;
const NS="http://www.w3.org/2000/svg", F="IBM Plex Sans Condensed, Arial Narrow, sans-serif";
const plot=document.getElementById("plot"), tip=document.getElementById("tip");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const fmt=v=>v==null?"..":Math.round(v).toLocaleString("en-IE");
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(k*p>=v)return k*p;}
let svg;
function draw(m){
  if(svg) svg.remove();
  const cfg=MS[m], ser=cfg.S.map(s=>({...s,pts:P.filter(d=>d[s.k]!=null).map(d=>({x:d.x,v:d[s.k],d}))})).filter(s=>s.pts.length);
  const ymax=niceMax(Math.max(...ser.flatMap(s=>s.pts.map(p=>p.v)))*1.05);
  const x=yr=>M.l+(yr-X0)/(X1-X0)*(W-M.l-M.r), y=v=>H-M.b-(v/ymax)*(H-M.t-M.b);
  svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":`Registered tonnage entering Dublin, ${m}, 1786 to 1896`});
  plot.insertBefore(svg,tip);
  for(let i=0;i<=5;i++){const v=ymax*i/5,yy=y(v);
    el("line",{x1:M.l,x2:W-M.r,y1:yy,y2:yy,stroke:i?"var(--grid)":"var(--rule)","stroke-width":1},svg);
    el("text",{x:M.l-8,y:yy+4,"text-anchor":"end","font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=fmt(v);}
  for(let yr=1780;yr<=1900;yr+=20)el("text",{x:x(yr),y:H-M.b+18,"text-anchor":"middle","font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=yr;
  if(m==="trade"||m==="coast"){
    el("line",{x1:x(1823.5),x2:x(1823.5),y1:M.t,y2:H-M.b,stroke:"var(--seam)","stroke-width":1.2,"stroke-dasharray":"2 3"},svg);
    el("text",{x:x(1823.5)+4,y:M.t+12,"font-family":F,"font-size":11.5,fill:"var(--fg)"},svg).textContent="1823 reclassification";}
  if(m==="total"){const d=P[0];el("text",{x:x(d.x)+8,y:y(d.total)-8,"font-family":F,"font-size":11,fill:"var(--muted)"},svg).textContent="18 months, 1786–1787";}
  for(const s of ser){
    let d="",prev=null;
    for(const p of s.pts){
      const full=p.d.m===12, join=prev&&full&&prev.d.m===12&&p.x-prev.x<=1&&!(s.brk&&prev.x<=s.brk&&p.x>s.brk);
      if(full) d+=(join?"L":"M")+x(p.x).toFixed(1)+","+y(p.v).toFixed(1);
      prev=p;}
    el("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    s.pts.forEach((p,i)=>{const pv=s.pts[i-1],nx=s.pts[i+1];
      if(p.d.m!==12) el("circle",{cx:x(p.x),cy:y(p.v),r:3.6,fill:"var(--surface)",stroke:s.color,"stroke-width":1.8},svg);
      else if((!pv||pv.d.m!==12||p.x-pv.x>1)&&(!nx||nx.d.m!==12||nx.x-p.x>1)) el("circle",{cx:x(p.x),cy:y(p.v),r:3,fill:s.color},svg);
      if(p.d.st==="flagged") el("circle",{cx:x(p.x),cy:y(p.v),r:6,fill:"none",stroke:"var(--gap)","stroke-width":1.5},svg);});
  }
  const ends=ser.map(s=>({s,yy:y(s.pts[s.pts.length-1].v),xx:x(s.pts[s.pts.length-1].x)})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++) if(ends[i].yy-ends[i-1].yy<14) ends[i].yy=ends[i-1].yy+14;
  for(const e of ends) el("text",{x:e.xx+8,y:e.yy+4,"font-family":F,"font-size":12,fill:"var(--fg)"},svg).textContent=e.s.label;
  const hair=el("line",{y1:M.t,y2:H-M.b,stroke:"var(--muted)","stroke-width":1,visibility:"hidden"},svg);
  const hit=el("rect",{x:M.l,y:M.t,width:W-M.l-M.r,height:H-M.t-M.b,fill:"transparent",tabindex:0,"aria-label":"Move across the chart to read values"},svg);
  function show(i){
    i=Math.max(0,Math.min(P.length-1,i)); const d=P[i], px=x(d.x);
    hair.setAttribute("x1",px);hair.setAttribute("x2",px);hair.setAttribute("visibility","visible");
    tip.replaceChildren();
    const h=document.createElement("div");h.className="yr";h.textContent=d.p==="1800a"||d.p==="1800b"?"1800":d.p;tip.appendChild(h);
    if(d.m!==12||d.x<1801){const t=document.createElement("div");t.className="note";t.textContent=d.t;tip.appendChild(t);}
    for(const s of ser){const r=document.createElement("div");r.className="row";const sp=document.createElement("span");
      const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;sp.append(k,document.createTextNode(s.label));
      const b=document.createElement("b");b.textContent=fmt(d[s.k]);r.append(sp,b);tip.appendChild(r);}
    if(m==="coast"&&d.stcol!=null){const n=document.createElement("div");n.className="note";n.textContent=`colliers: steam ${fmt(d.stcol)}, sailing ${fmt(d.sacol)}`;tip.appendChild(n);}
    if(d.note){const n=document.createElement("div");n.className="note";n.textContent=d.note;tip.appendChild(n);}
    tip.hidden=false;
    const box=svg.getBoundingClientRect(), left=px*box.width/W+plot.scrollLeft;
    tip.style.top="8px"; tip.style.left=(left+200>box.width?left-200:left+12)+"px";
    cur=i;
  }
  let cur=P.length-1;
  hit.addEventListener("pointermove",e=>{const b=svg.getBoundingClientRect();const yr=X0+((e.clientX-b.left)*W/b.width-M.l)/(W-M.l-M.r)*(X1-X0);
    let best=0;P.forEach((d,i)=>{if(Math.abs(d.x-yr)<Math.abs(P[best].x-yr))best=i;});show(best);});
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  hit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){show(cur+(e.key==="ArrowRight"?1:-1));e.preventDefault();}});
  hit.addEventListener("focus",()=>show(cur)); hit.addEventListener("blur",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  const lg=document.getElementById("legend"); lg.replaceChildren();
  for(const s of ser){const sp=document.createElement("span");const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;sp.append(k,document.createTextNode(s.label));lg.appendChild(sp);}
  const o=document.createElement("span");const r=document.createElement("i");r.className="ring";o.append(r,document.createTextNode("not 12 months"));lg.appendChild(o);
  document.getElementById("caption").textContent=cfg.cap+" The red ring marks 1891, where the printed sums do not agree.";
  const tb=document.getElementById("table"); tb.replaceChildren();
  const hr=tb.insertRow(); for(const t of ["Period",...ser.map(s=>s.label),"Note"]){const th=document.createElement("th");th.textContent=t;hr.appendChild(th);}
  for(const d of P){if(ser.every(s=>d[s.k]==null))continue;const rr=tb.insertRow();rr.insertCell().textContent=d.m===12&&d.x>=1801?d.p:d.t;
    ser.forEach(s=>{rr.insertCell().textContent=fmt(d[s.k]);});const c=rr.insertCell();c.textContent=d.note;c.style.textAlign="left";c.style.fontSize=".8rem";}
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".seg button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));draw(b.dataset.m);}));
draw("total");
</script>
<script>if(window.top===window.self)document.getElementById("cephCite").hidden=false;</script>
<script>(function(){function h(){var w=document.querySelector('.wrap');parent.postMessage({cephEmbed:'dublin-port-tonnage',height:Math.ceil((w?w.getBoundingClientRect().bottom+window.scrollY:document.body.scrollHeight)+8)},'*');}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body);document.addEventListener('toggle',h,true);})();</script>
</body></html>
