  const hair=el("line",{y1:M.t,y2:H-M.b,stroke:"var(--muted)","stroke-width":1,visibility:"hidden"},svg);
  const hit=el("rect",{x:M.l,y:M.t,width:W-M.l-M.r,height:H-M.t-M.b,fill:"transparent",tabindex:0,"aria-label":"Move across the chart to read values"},svg);
  const lookup=ser.map(s=>new Map(s.pts.map(p=>[p[0],p])));
  function show(yr){
    yr=Math.max(D.y0,Math.min(D.y1,yr));
    const px=x(yr); hair.setAttribute("x1",px);hair.setAttribute("x2",px);hair.setAttribute("visibility","visible");
    tip.replaceChildren();
    const h=document.createElement("div");h.className="yr";h.textContent=yr;tip.appendChild(h);
    ser.forEach((s,i)=>{const p=lookup[i].get(yr);const r=document.createElement("div");r.className="row";
      const sp=document.createElement("span");const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;
      sp.append(k,document.createTextNode(s.label));const b=document.createElement("b");b.textContent=fmt(p?p[1]:null);
      if(p&&p[3]){const sm=document.createElement("small");sm.textContent=" ("+p[3]+")";b.appendChild(sm);}
      r.append(sp,b);tip.appendChild(r);});
    const n=D.notes[yr]; if(n){const d=document.createElement("div");d.className="note";d.textContent=n;tip.appendChild(d);}
    tip.hidden=false;
    const box=svg.getBoundingClientRect(), scale=box.width/W, left=px*scale+plot.scrollLeft;
    tip.style.top="8px"; tip.style.left=(left+250>box.width?left-250:left+12)+"px";
  }
  hit.addEventListener("pointermove",e=>{const b=svg.getBoundingClientRect();const vx=(e.clientX-b.left)*W/b.width;show(Math.round(X0+(vx-M.l)/(W-M.l-M.r)*(X1-X0)));});
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  let ky=1856; hit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ky+=e.key==="ArrowRight"?1:-1;ky=Math.max(D.y0,Math.min(D.y1,ky));show(ky);e.preventDefault();}});
  hit.addEventListener("focus",()=>show(ky)); hit.addEventListener("blur",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  const lg=document.getElementById("legend"); lg.replaceChildren();
  for(const s of ser){const sp=document.createElement("span");const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;sp.append(k,document.createTextNode(s.label));lg.appendChild(sp);}
  if(!P) for(const [c,t] of [["dot full","full returns"],["dot","partial or round"]]){const sp=document.createElement("span");const k=document.createElement("i");k.className=c;sp.append(k,document.createTextNode(t));lg.appendChild(sp);}
  document.getElementById("caption").textContent=CAP[m];
  const tb=document.getElementById("table"); tb.replaceChildren();
  const hr=tb.insertRow(); for(const t of ["Year",...ser.map(s=>s.label)]){const th=document.createElement("th");th.textContent=t;hr.appendChild(th);}
  const years=[...new Set(ser.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>a-b);
  for(const yr of years){const r=tb.insertRow();r.insertCell().textContent=yr;lookup.forEach(mp=>{const p=mp.get(yr);r.insertCell().textContent=p?(fmt(p[1])+(p[2]===2?" *":"")):"..";});}
}
