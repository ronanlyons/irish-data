<script>
/* CEPH entry kit: county choropleth with a year slider and a Play button (28 Oct 2026; Play added 29 Oct).
   Inline this file into an entry page after the GEO and data constants. Styling comes from the schools entry
   template's tokens (--fg, --muted, --rule, --surface, --label, --s1); the fill ramp uses --m1..--m5 and --m0 (no figure),
   which each entry defines in its :root and dark blocks (see README.md in this folder for values).

   countyMap(el, {
     geo,                      // counties_svg.json: {w, h, counties: {Name: [[[x,y],...], ...]}}
     frames,                   // {year: {County: value}} — county names as in counties_svg.json
     measures,                 // optional [{key, label, frames, unit, fmt}] — a measure switch (e.g. counts / per 1,000 people)
     unit, fmt,                // label for the legend and tooltip; fmt(v) -> string
     breaks,                   // optional fixed class breaks (4 numbers), else quintiles over ALL years of the measure
     note: {year: text},       // optional per-year caption line
     outline6: true            // draw the 1921 border (six counties) as a heavier line
   })
   The same classes hold across years so a reader can compare maps over time. Counties with no figure are hatched
   grey (--m0) and say "no figure" in the tooltip. A table of every year sits under the map for keyboard and screen-reader use. */
function countyMap(el, o) {
  const SIX = new Set(["Antrim", "Armagh", "Down", "Fermanagh", "Londonderry", "Tyrone"]);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const measures = o.measures || [{ key: "v", label: o.unit || "", frames: o.frames, unit: o.unit, fmt: o.fmt }];
  let m = measures[0];
  const years = () => Object.keys(m.frames).sort((a, b) => +a - +b);
  let year = years()[years().length - 1];
  const paths = Object.fromEntries(Object.entries(o.geo.counties).map(([n, rs]) => [n, rs.map(r => "M" + r.map(p => p.join(",")).join("L") + "Z").join("")]));
  const id = "cm" + Math.random().toString(36).slice(2, 7);
  el.innerHTML = `
    <div class="controls">${measures.length > 1 ? `<div class="seg" role="group" aria-label="Measure">${measures.map((x, i) => `<button type="button" data-k="${esc(x.key)}" aria-pressed="${i === 0}">${esc(x.label)}</button>`).join("")}</div>` : "<span></span>"}
      <div class="cm-year"><button type="button" class="cm-play" aria-label="Play through the years">▶ Play</button> <label for="${id}-r" class="eyebrow">Year</label> <output id="${id}-o" class="cm-yr"></output></div></div>
    <input type="range" id="${id}-r" class="cm-range" min="0" step="1" aria-label="Year">
    <div class="cm-body"><div class="cm-svg"></div><div class="cm-side"><div class="cm-legend"></div><div class="cm-top"></div></div></div>
    <div class="caption cm-cap"></div>

  const css = document.createElement("style");

  .cm-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}.cm-svg svg{width:100%;height:auto;display:block}
  .cm-svg path{stroke:var(--surface);stroke-width:.7}.cm-svg path:hover{stroke:var(--fg);stroke-width:1.4}.cm-svg path.b6{stroke:var(--fg);stroke-width:1.2;fill:none;pointer-events:none}
  .cm-legend{display:grid;gap:3px;font-family:var(--label);font-size:.85rem;color:var(--muted)}.cm-legend div{display:flex;gap:8px;align-items:center}.cm-legend i{width:22px;height:12px;display:inline-block;border-radius:2px}
  .cm-top{margin-top:14px;font-family:var(--label);font-size:.88rem}.cm-top ol{margin:4px 0 0;padding-left:1.3em}.cm-top li{display:list-item}.cm-top b{font-variant-numeric:tabular-nums;font-weight:600}
  .cm-cap{min-height:1.2em}.cm-year{display:flex;align-items:center;gap:10px}.cm-play{font-family:var(--label);font-size:.92rem;border:1px solid var(--rule);background:transparent;color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer;min-width:84px}.cm-play[aria-pressed="true"]{background:var(--fg);color:var(--surface)}.cm-play:focus-visible{outline:2px solid var(--s1);outline-offset:2px}@media (max-width:620px){.cm-body{grid-template-columns:1fr}}`;

    $(".cm-svg").innerHTML = `<svg viewBox="0 0 ${o.geo.w} ${o.geo.h}" role="img" aria-label="${esc(m.label || m.unit || "")} by county, ${esc(year)}">${g}</svg>`;
    const lo = [null, ...br], hi = [...br, null];
    $(".cm-legend").innerHTML = `<div class="eyebrow">${esc(m.unit || m.label || "")}</div>` + [1, 2, 3, 4, 5].map(i => `<div><i style="background:var(--m${i})"></i>${lo[i - 1] === null ? "up to " + fmt(hi[i - 1]) : hi[i - 1] === null ? "over " + fmt(lo[i - 1]) : fmt(lo[i - 1]) + " – " + fmt(hi[i - 1])}</div>`).join("") + `<div><i style="background:var(--m0)"></i>no figure</div>`;

    const n = p.dataset.n, v = (m.frames[year] || {})[n], r = el.getBoundingClientRect();
    tip.innerHTML = `<div class="yr">${esc(n)}, ${esc(year)}</div><div class="row"><b>${typeof v === "number" ? fmt(v) : "no figure"}</b></div>`;
    tip.hidden = false; tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 160) + "px"; tip.style.top = (e.clientY - r.top + 12) + "px";
  });
  el.addEventListener("pointerleave", () => tip.hidden = true);
  draw();
}

</script>
<script>
countyMap(document.getElementById("map"), {
  geo: GEO,
  measures: [
    {key:"cnt", label:"Offences", frames:MAP.cnt, unit:"Offences known to the police", fmt:v=>Math.round(v).toLocaleString("en-IE")},
    {key:"rate", label:"Per 10,000 people", frames:MAP.rate, unit:"Offences per 10,000 people", fmt:v=>v.toFixed(1)}
  ],
  note: MAP.note,
  outline6: true
});

const S = [
  {key:"Ireland", label:"Whole island", color:"var(--s1)"},
  {key:"26 counties", label:"26 counties", color:"var(--s2)"},
  {key:"6 counties", label:"6 counties", color:"var(--s3)"},
];
const CAP = {
  "Offences":"Indictable crimes known to the police in the year. To 1894, offences not disposed of summarily; from 1895, every indictable offence (the revised form). The open circle is 1894 restated on the revised form by the 1913 volume. No volume is held for 1878.",
  "Per 10,000 people":"Crimes per 10,000 people at the nearest census (1871 to 1911). The break at 1894/95 is in the count, as for the offences."
};
const W=880,H=380,M={l:64,r:96,t:18,b:34},X0=1869,X1=1915;
const NS="http://www.w3.org/2000/svg", F="IBM Plex Sans Condensed, Arial Narrow, sans-serif";
const plot=document.getElementById("plot"), tip=document.getElementById("tip");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const fmtN=v=>v==null?"..":Math.round(v).toLocaleString("en-IE");
const fmtR=v=>v==null?"..":v.toFixed(1);
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(k*p>=v)return k*p;}
let svg;
function draw(m){
  if(svg) svg.remove();
  const fmt = m==="Offences"?fmtN:fmtR;
  const ser=S.map(s=>({...s,pts:(DATA[m][s.key]||[])})).filter(s=>s.pts.length);
  const all=ser.flatMap(s=>s.pts.map(p=>p[1])), ymax=niceMax(Math.max(...all)*1.05);
  const x=y=>M.l+(y-X0)/(X1-X0)*(W-M.l-M.r), y=v=>H-M.b-(v/ymax)*(H-M.t-M.b);
  svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":`${m}, 1871 to 1913`});
  plot.insertBefore(svg,tip);
  // gap: 1878, no volume held
  el("rect",{x:x(1877.5),y:M.t,width:x(1878.5)-x(1877.5),height:H-M.t-M.b,fill:"var(--gap)","fill-opacity":".08"},svg);
  el("text",{x:x(1878),y:M.t+12,"text-anchor":"middle","font-family":F,"font-size":11,fill:"var(--muted)"},svg).textContent="gap";
  for(let i=0;i<=5;i++){const v=ymax*i/5,yy=y(v);
    el("line",{x1:M.l,x2:W-M.r,y1:yy,y2:yy,stroke:i?"var(--grid)":"var(--rule)","stroke-width":1},svg);
    el("text",{x:M.l-8,y:yy+4,"text-anchor":"end","font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=m==="Offences"?fmtN(v):(+v.toFixed(1)).toString();}
  for(let yr=1870;yr<=1915;yr+=5)el("text",{x:x(yr),y:H-M.b+18,"text-anchor":"middle","font-family":F,"font-size":12,fill:"var(--muted)"},svg).textContent=yr;
  // the 1894/95 break
  el("line",{x1:x(1894.5),x2:x(1894.5),y1:M.t,y2:H-M.b,stroke:"var(--seam)","stroke-width":1.2,"stroke-dasharray":"2 3"},svg);
  el("text",{x:x(1894.5)+5,y:M.t+12,"font-family":F,"font-size":11.5,"font-weight":600,fill:"var(--fg)"},svg).textContent="new count from 1895";
  for(const s of ser){
    let d="",prev=null;
    for(const [yr,v,b] of s.pts){d+=(prev&&yr-prev[0]===1&&b===prev[2]?"L":"M")+x(yr).toFixed(1)+","+y(v).toFixed(1);prev=[yr,v,b];}
    el("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    s.pts.forEach(([yr,v,b],i)=>{
      const pv=s.pts[i-1],nx=s.pts[i+1];
      const alone=(!pv||yr-pv[0]!==1||pv[2]!==b)&&(!nx||nx[0]-yr!==1||nx[2]!==b);
      if(yr===1894&&b===1) el("circle",{cx:x(yr),cy:y(v),r:4,fill:"var(--surface)",stroke:s.color,"stroke-width":2},svg);
      else if(alone) el("circle",{cx:x(yr),cy:y(v),r:3.5,fill:s.color},svg);});
    const last=s.pts[s.pts.length-1];
    el("circle",{cx:x(last[0]),cy:y(last[1]),r:3.5,fill:s.color,stroke:"var(--surface)","stroke-width":2},svg);
  }
  const ends=ser.map(s=>({s,yy:y(s.pts[s.pts.length-1][1]),xx:x(s.pts[s.pts.length-1][0])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++) if(ends[i].yy-ends[i-1].yy<14) ends[i].yy=ends[i-1].yy+14;
  for(const e of ends) el("text",{x:e.xx+8,y:e.yy+4,"font-family":F,"font-size":12,fill:"var(--fg)"},svg).textContent=e.s.label;
  const hair=el("line",{y1:M.t,y2:H-M.b,stroke:"var(--muted)","stroke-width":1,visibility:"hidden"},svg);
  const hit=el("rect",{x:M.l,y:M.t,width:W-M.l-M.r,height:H-M.t-M.b,fill:"transparent",tabindex:0,"aria-label":"Move across the chart to read values"},svg);
  const look=ser.map(s=>{const mp=new Map();for(const [yr,v,b] of s.pts){if(!mp.has(yr))mp.set(yr,[]);mp.get(yr).push([v,b]);}return mp;});
  const show=yr=>{
    yr=Math.max(1871,Math.min(1913,yr));
    const px=x(yr); hair.setAttribute("x1",px);hair.setAttribute("x2",px);hair.setAttribute("visibility","visible");
    tip.replaceChildren();
    const h=document.createElement("div");h.className="yr";h.textContent=yr;tip.appendChild(h);
    ser.forEach((s,i)=>{const vs=look[i].get(yr)||[[null,0]];
      for(const [v,b] of vs){const r=document.createElement("div");r.className="row";
        const sp=document.createElement("span");const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;
        sp.append(k,document.createTextNode(s.label+(vs.length>1?(b?" (new count)":" (old count)"):"")));
        const bb=document.createElement("b");bb.textContent=fmt(v);r.append(sp,bb);tip.appendChild(r);}});
    const n=yr===1878?"no volume held":yr<=1894?"form used to 1894":"revised form from 1895";
    const d=document.createElement("div");d.className="note";d.textContent=n;tip.appendChild(d);
    tip.hidden=false;
    const box=svg.getBoundingClientRect(), scale=box.width/W, left=px*scale+plot.scrollLeft;
    tip.style.top="8px"; tip.style.left=(left+190>box.width?left-190:left+12)+"px";
  };
  hit.addEventListener("pointermove",e=>{const b=svg.getBoundingClientRect();const vx=(e.clientX-b.left)*W/b.width;show(Math.round(X0+(vx-M.l)/(W-M.l-M.r)*(X1-X0)));});
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  let ky=1881; hit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ky+=e.key==="ArrowRight"?1:-1;show(ky);e.preventDefault();}});
  hit.addEventListener("focus",()=>show(ky)); hit.addEventListener("blur",()=>{tip.hidden=true;hair.setAttribute("visibility","hidden");});
  const lg=document.getElementById("legend"); lg.replaceChildren();
  for(const s of ser){const sp=document.createElement("span");const k=document.createElement("i");k.className="key";k.style.borderColor=s.color;sp.append(k,document.createTextNode(s.label));lg.appendChild(sp);}
  document.getElementById("caption").textContent=CAP[m];
  const tb=document.getElementById("table"); tb.replaceChildren();
  const hr=tb.insertRow(); for(const t of ["Year",...ser.map(s=>s.label)]){const th=document.createElement("th");th.textContent=t;hr.appendChild(th);}
  const keys=[...new Set(ser.flatMap(s=>s.pts.map(p=>p[0]+"|"+p[2])))].sort((a,b)=>{const [ya,ba]=a.split("|").map(Number),[yb,bb]=b.split("|").map(Number);return ya-yb||ba-bb;});
  for(const k of keys){const [yr,b]=k.split("|").map(Number);const r=tb.insertRow();
    r.insertCell().textContent=yr===1894?(b?"1894 (new count)":"1894 (old count)"):yr;
    look.forEach(mp=>{const hit=(mp.get(yr)||[]).find(z=>z[1]===b);r.insertCell().textContent=fmt(hit?hit[0]:null);});}
}
document.querySelectorAll("#chart-seg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#chart-seg button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));draw(b.dataset.m);}));
draw("Offences");
</script>
